name: Build Windows EXE

on:
  push:
    branches: [ chornyi-3741010-refactor-windows-desktop, main ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest -q
        continue-on-error: false

      - name: Build EXE with PyInstaller
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --name DE-JURIST-AI main.ru --add-data "${{ github.workspace }}/resources/system_prompt.txt;resources" --distpath "releases/DE-JURIST-AI-1.0.0/dist" --workpath "releases/DE-JURIST-AI-1.0.0/build" --specpath "releases/DE-JURIST-AI-1.0.0/specs" --clean

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DE-JURIST-AI-windows-exe
          path: releases/DE-JURIST-AI-1.0.0/dist/DE-JURIST-AI.exe
